<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 1080, H = 1920, FPS = 30, DURATION = 80;
const C = {
  bg0: '#02060F', bg1: '#081428', cyan: '#46CBFF', blue: '#2A7BFF', amber: '#FFB627',
  red: '#FF3448', green: '#2EE59D', white: '#EEF4FF', dim: '#6A7F9F', yellow: '#FFD84A',
  jacket: '#2D5288', pants: '#18263F', skin: '#C9D3E2', panel: 'rgba(4,12,26,0.88)'
};
const MONO = '"JetBrains Mono"', SANS = 'Inter';
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, b, k) => a + (b - a) * k;
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function rrect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// ---------- common UI ----------
function background(top = C.bg0, bottom = C.bg1) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, top); g.addColorStop(1, bottom);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(90,150,230,0.05)'; ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
}

// tag: panel with title (+ optional subtitle); k = appear progress 0..1
function tag(x, y, title, sub, color, k = 1, align = 'center', size = 30) {
  if (k <= 0) return;
  ctx.save();
  ctx.font = `800 ${size}px ${MONO}`;
  const tw = ctx.measureText(title).width;
  ctx.font = `500 ${Math.round(size * 0.62)}px ${MONO}`;
  const sw = sub ? ctx.measureText(sub).width : 0;
  const w = Math.max(tw, sw) + 44, h = sub ? size * 2.25 : size * 1.65;
  let x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  const s = 0.82 + 0.18 * eo(k);
  ctx.globalAlpha = clamp(k * 1.6);
  ctx.translate(x0 + w / 2, y + h / 2); ctx.scale(s, s); ctx.translate(-(x0 + w / 2), -(y + h / 2));
  ctx.shadowColor = color; ctx.shadowBlur = 24;
  rrect(x0, y, w, h, 10); ctx.fillStyle = C.panel; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = color; ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = color; ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  ctx.font = `800 ${size}px ${MONO}`; ctx.fillText(title, x0 + 22, y + size * 0.3);
  if (sub) { ctx.fillStyle = C.dim; ctx.font = `500 ${Math.round(size * 0.62)}px ${MONO}`; ctx.fillText(sub, x0 + 22, y + size * 1.4); }
  ctx.restore();
}

function hud(text, color = C.cyan, k = 1) { tag(W / 2, 110, text, null, color, k, 'center', 30); }

function glowText(text, x, y, font, color, blur = 30, align = 'center') {
  ctx.save(); ctx.font = font; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.fillStyle = color; ctx.fillText(text, x, y);
  ctx.shadowBlur = 0; ctx.fillText(text, x, y); ctx.restore();
}

// ---------- subtitles ----------
function parseChunk(s) {
  const words = [];
  const re = /\*([^*]+)\*|!([^!]+)!|([^*!]+)/g; let m;
  while ((m = re.exec(s))) {
    const color = m[1] ? C.yellow : m[2] ? C.red : C.white;
    const txt = m[1] || m[2] || m[3];
    txt.split(/\s+/).filter(Boolean).forEach(w => words.push({ w, color }));
  }
  return words;
}
function drawSub(chunk, age, big = false) {
  const words = parseChunk(chunk);
  const fs = big ? 150 : 92, lh = fs * 1.12, maxW = 960;
  ctx.save(); ctx.font = `900 ${fs}px ${SANS}`;
  const space = ctx.measureText(' ').width;
  const lines = []; let cur = [], cw = 0;
  for (const wd of words) {
    const ww = ctx.measureText(wd.w).width;
    if (cur.length && cw + space + ww > maxW) { lines.push({ ws: cur, w: cw }); cur = []; cw = 0; }
    cw += (cur.length ? space : 0) + ww; cur.push({ ...wd, ww });
  }
  if (cur.length) lines.push({ ws: cur, w: cw });
  const pop = 1 + 0.14 * (1 - eo(clamp(age / 0.16)));
  const cy = big ? 960 : 1470;
  ctx.translate(W / 2, cy); ctx.scale(pop, pop); ctx.translate(-W / 2, -cy);
  ctx.globalAlpha = clamp(age / 0.08);
  ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  const y0 = cy - (lines.length - 1) * lh / 2;
  lines.forEach((ln, i) => {
    let x = W / 2 - ln.w / 2; const y = y0 + i * lh;
    for (const wd of ln.ws) {
      ctx.lineWidth = 16; ctx.strokeStyle = 'rgba(0,0,0,0.9)'; ctx.strokeText(wd.w, x, y);
      if (wd.color !== C.white) { ctx.shadowColor = wd.color; ctx.shadowBlur = 26; }
      ctx.fillStyle = wd.color; ctx.fillText(wd.w, x, y); ctx.shadowBlur = 0;
      x += wd.ww + space;
    }
  });
  ctx.restore();
}

// ---------- fog ----------
const FOG = (() => { const r = rng(7); return Array.from({ length: 46 }, () => ({ x: r() * 1300 - 110, y: r(), rad: 140 + r() * 220, sp: 8 + r() * 22, ph: r() * 6.28 })); })();
function fog(alpha, t, yTop, yBottom, wavy = true) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.beginPath(); ctx.moveTo(0, yTop); ctx.lineTo(W, yTop);
  for (let x = W; x >= 0; x -= 20) ctx.lineTo(x, yBottom + (wavy ? Math.sin(x / 90 + t * 1.6) * 18 + Math.sin(x / 37 - t) * 8 : 0));
  ctx.closePath(); ctx.clip();
  const g = ctx.createLinearGradient(0, yTop, 0, yBottom);
  g.addColorStop(0, `rgba(70,76,88,${0.92 * alpha})`); g.addColorStop(1, `rgba(110,116,128,${0.55 * alpha})`);
  ctx.fillStyle = g; ctx.fillRect(0, yTop, W, yBottom - yTop + 40);
  for (const b of FOG) {
    const x = (b.x + t * b.sp) % 1300 - 110, y = lerp(yTop, yBottom, b.y) + Math.sin(t + b.ph) * 20;
    const rg = ctx.createRadialGradient(x, y, 0, x, y, b.rad);
    rg.addColorStop(0, `rgba(160,166,178,${0.28 * alpha})`); rg.addColorStop(1, 'rgba(160,166,178,0)');
    ctx.fillStyle = rg; ctx.fillRect(x - b.rad, y - b.rad, b.rad * 2, b.rad * 2);
  }
  ctx.restore();
}

// ---------- cabin (top-down) ----------
const ROW0 = 300, RS = 28;
const rowY = i => ROW0 + i * RS;
const SEATX = [392, 432, 472, 574, 614, 654];
function drawCabin(o = {}) {
  const appear = o.appear ?? 1;
  ctx.save();
  // wings
  ctx.fillStyle = 'rgba(40,110,200,0.10)'; ctx.strokeStyle = 'rgba(70,203,255,0.35)'; ctx.lineWidth = 2;
  [[370, -1], [710, 1]].forEach(([x, d]) => {
    ctx.beginPath(); ctx.moveTo(x, 600); ctx.lineTo(x + d * 330, 840); ctx.lineTo(x + d * 330, 880); ctx.lineTo(x, 770); ctx.closePath(); ctx.fill(); ctx.stroke();
  });
  // tail
  ctx.beginPath(); ctx.moveTo(540, 1250); ctx.lineTo(380, 1360); ctx.lineTo(380, 1385); ctx.lineTo(540, 1340); ctx.lineTo(700, 1385); ctx.lineTo(700, 1360); ctx.closePath(); ctx.fill(); ctx.stroke();
  // fuselage
  ctx.beginPath();
  ctx.moveTo(370, 300); ctx.bezierCurveTo(370, 180, 470, 130, 540, 130); ctx.bezierCurveTo(610, 130, 710, 180, 710, 300);
  ctx.lineTo(710, 1200); ctx.bezierCurveTo(710, 1290, 600, 1350, 540, 1360); ctx.bezierCurveTo(480, 1350, 370, 1290, 370, 1200); ctx.closePath();
  ctx.fillStyle = 'rgba(14,40,84,0.55)'; ctx.fill();
  ctx.shadowColor = C.cyan; ctx.shadowBlur = 18; ctx.strokeStyle = C.cyan; ctx.lineWidth = 3; ctx.stroke(); ctx.shadowBlur = 0;
  // seats
  for (let i = 1; i <= 32; i++) {
    const k = seg(appear * 34 - i, 0, 1);
    if (k <= 0) continue;
    const y = rowY(i);
    const hl = o.rows && o.rows[i] ? o.rows[i] : 0;
    for (let j = 0; j < 6; j++) {
      const you = o.you && i === 27 && j === 2;
      ctx.globalAlpha = k;
      rrect(SEATX[j], y - 10, 34, 21, 5);
      if (you) {
        const p = 0.6 + 0.4 * Math.sin((o.t || 0) * 8);
        ctx.fillStyle = C.amber; ctx.shadowColor = C.amber; ctx.shadowBlur = 20 * p; ctx.fill(); ctx.shadowBlur = 0;
      } else {
        ctx.fillStyle = hl ? `rgba(255,182,39,${0.25 + 0.55 * hl})` : 'rgba(70,130,210,0.35)'; ctx.fill();
        ctx.strokeStyle = hl ? C.amber : 'rgba(70,203,255,0.35)'; ctx.lineWidth = 1.5; ctx.stroke();
      }
    }
    ctx.globalAlpha = k * 0.7; ctx.fillStyle = C.dim; ctx.font = `500 13px ${MONO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(i), 540, y);
  }
  ctx.globalAlpha = 1;
  // exits
  const ex = [270, 650, 1228];
  ex.forEach(y => {
    [[352, 'right'], [728, 'left']].forEach(([x]) => {
      ctx.shadowColor = C.green; ctx.shadowBlur = 16; ctx.fillStyle = C.green;
      rrect(x - 8, y - 18, 16, 36, 4); ctx.fill(); ctx.shadowBlur = 0;
    });
  });
  ctx.restore();
}

// ---------- figures ----------
function limb(x1, y1, x2, y2, w, color) { ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function ik(hx, hy, fx, fy, L1, L2, dir = 1) {
  const dx = fx - hx, dy = fy - hy; const d = Math.min(Math.hypot(dx, dy), L1 + L2 - 0.01);
  const a = Math.atan2(dy, dx); const cosA = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
  const ang = a - dir * Math.acos(clamp(cosA, -1, 1));
  return [hx + Math.cos(ang) * L1, hy + Math.sin(ang) * L1];
}
// side-view walking/crouching figure facing right
function sideFigure(x, footY, crouch, walk, sc = 1, opt = {}) {
  ctx.save(); ctx.translate(x, footY); ctx.scale(sc, sc);
  const hipY = -lerp(158, 96, crouch), ta = lerp(0.06, 1.05, crouch);
  const sx = Math.sin(ta) * 120, sy = hipY - Math.cos(ta) * 120;
  const legs = [walk, walk + Math.PI];
  legs.forEach((ph, i) => {
    const fx = Math.sin(ph) * 38 + (crouch * 20), fy = -Math.max(0, Math.cos(ph)) * 10 * (opt.walking ? 1 : 0);
    const [kx, ky] = ik(0, hipY, fx, fy, 82, 82, -1);
    const col = i ? '#121D31' : C.pants;
    limb(0, hipY, kx, ky, 30, col); limb(kx, ky, fx, fy, 28, col);
    limb(fx, fy - 4, fx + 22, fy - 4, 16, '#0B1220');
  });
  // back arm
  limb(sx * 0.9, sy + 10, sx + 40 + crouch * 30, sy + 80 + crouch * 10, 24, '#22406C');
  // torso
  limb(0, hipY, sx, sy, 56, C.jacket);
  // head
  const hx = sx + Math.sin(ta) * 46, hy = sy - Math.cos(ta) * 46;
  ctx.fillStyle = C.skin; ctx.beginPath(); ctx.arc(hx, hy, 36, 0, 7); ctx.fill();
  ctx.fillStyle = '#2A3446'; ctx.beginPath(); ctx.arc(hx - 6, hy - 6, 34, Math.PI * 0.9 + ta, Math.PI * 1.75 + ta); ctx.fill();
  // front arm
  limb(sx, sy + 10, sx + 50 + crouch * 40, sy + 70 + crouch * 30, 24, '#3A64A2');
  ctx.restore();
  return { hx: x + hx * sc, hy: footY + hy * sc };
}

// seated side view, a = forward lean (0..0.92)
function seatedFigure(hx, hy, a, armsUp) {
  // legs
  limb(hx, hy, hx + 150, hy + 4, 34, C.pants); limb(hx + 150, hy + 4, hx + 162, hy + 150, 30, C.pants);
  limb(hx + 162, hy + 150, hx + 192, hy + 150, 18, '#0B1220');
  const L = 170, sx = hx + Math.sin(a) * L, sy = hy - Math.cos(a) * L;
  const hdx = sx + Math.sin(a) * 52, hdy = sy - Math.cos(a) * 52;
  limb(hx, hy, sx, sy, 60, C.jacket);
  ctx.fillStyle = C.skin; ctx.beginPath(); ctx.arc(hdx, hdy, 42, 0, 7); ctx.fill();
  ctx.fillStyle = '#2A3446'; ctx.beginPath(); ctx.arc(hdx - 4, hdy - 6, 40, Math.PI * 0.95 + a, Math.PI * 1.8 + a); ctx.fill();
  if (armsUp > 0) {
    const tx = lerp(hx + 140, hdx + 30, armsUp), ty = lerp(hy - 10, hdy - 40, armsUp);
    const [ex, ey] = ik(sx, sy + 10, tx, ty, 80, 80, 1);
    limb(sx, sy + 10, ex, ey, 26, '#3A64A2'); limb(ex, ey, tx, ty, 24, '#3A64A2');
  } else {
    limb(sx, sy + 12, hx + 70, hy - 20, 26, '#3A64A2'); limb(hx + 70, hy - 20, hx + 140, hy - 8, 24, '#3A64A2');
  }
  return { hdx, hdy };
}
function seatSide(x, floorY) {
  ctx.fillStyle = '#16294A'; ctx.strokeStyle = 'rgba(70,203,255,0.45)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x - 90, floorY - 150); ctx.lineTo(x - 120, floorY - 470); ctx.lineTo(x - 80, floorY - 475); ctx.lineTo(x - 52, floorY - 150); ctx.closePath(); ctx.fill(); ctx.stroke();
  rrect(x - 95, floorY - 175, 190, 34, 10); ctx.fill(); ctx.stroke();
  limb(x - 60, floorY - 140, x - 70, floorY, 8, '#0F1D36'); limb(x + 70, floorY - 140, x + 80, floorY, 8, '#0F1D36');
}

// front-view seated person
function frontFigure(x, y, s, col = C.jacket) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#132542'; rrect(-110, -150, 220, 360, 30); ctx.fill();
  ctx.strokeStyle = 'rgba(70,203,255,0.35)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = col; rrect(-80, 0, 160, 210, 50); ctx.fill();
  ctx.fillStyle = C.skin; ctx.beginPath(); ctx.arc(0, -50, 52, 0, 7); ctx.fill();
  ctx.fillStyle = '#2A3446'; ctx.beginPath(); ctx.arc(0, -62, 52, Math.PI, 0); ctx.fill();
  ctx.restore();
}
function mask(x, y, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.shadowColor = C.yellow; ctx.shadowBlur = 18; ctx.fillStyle = C.yellow;
  ctx.beginPath(); ctx.moveTo(-30, -24); ctx.lineTo(30, -24); ctx.lineTo(22, 22); ctx.quadraticCurveTo(0, 34, -22, 22); ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = '#C49A10'; rrect(-30, -28, 60, 10, 4); ctx.fill();
  ctx.restore();
}

// ---------- scenes ----------
const scenes = [];
function S(t0, t1, draw, subs) { scenes.push({ t0, t1, draw, subs }); }

// 1. Porthole — plane is falling
S(0, 4, (lt) => {
  const sh = 6 + lt * 3;
  ctx.translate(Math.sin(lt * 37) * sh, Math.cos(lt * 29) * sh);
  background('#070D19', '#0B1426');
  const cx = 540, cy = 760, rx = 300, ry = 400;
  ctx.save(); rrect(cx - rx, cy - ry, rx * 2, ry * 2, 260); ctx.clip();
  const ang = -0.12 - 0.45 * eio(seg(lt, 0, 4)) + 0.03 * Math.sin(lt * 11);
  ctx.translate(cx, cy); ctx.rotate(ang);
  const hy = -200 + lt * 60;
  const sky = ctx.createLinearGradient(0, -700, 0, hy); sky.addColorStop(0, '#071430'); sky.addColorStop(1, '#2A4F86');
  ctx.fillStyle = sky; ctx.fillRect(-800, -900, 1600, hy + 900);
  ctx.fillStyle = '#050B16'; ctx.fillRect(-800, hy, 1600, 1200);
  const r = rng(3);
  for (let i = 0; i < 160; i++) { const x = r() * 1400 - 700, y = hy + 20 + r() * 600; ctx.fillStyle = r() > .5 ? '#FFC870' : '#9FD8FF'; ctx.globalAlpha = .4 + r() * .6; ctx.fillRect(x, y, 3, 3); }
  ctx.globalAlpha = 1;
  const rc = rng(11);
  for (let i = 0; i < 14; i++) {
    const x = rc() * 1200 - 600, base = rc() * 1600, sp = 500 + rc() * 400;
    const y = 900 - ((base + lt * sp) % 1800);
    const g = ctx.createRadialGradient(x, y, 0, x, y, 180); g.addColorStop(0, 'rgba(190,210,240,0.55)'); g.addColorStop(1, 'rgba(190,210,240,0)');
    ctx.fillStyle = g; ctx.fillRect(x - 180, y - 180, 360, 360);
  }
  ctx.restore();
  ctx.lineWidth = 34; ctx.strokeStyle = '#1A2840'; rrect(cx - rx, cy - ry, rx * 2, ry * 2, 260); ctx.stroke();
  ctx.lineWidth = 4; ctx.strokeStyle = C.cyan; ctx.shadowColor = C.cyan; ctx.shadowBlur = 16; rrect(cx - rx - 20, cy - ry - 20, rx * 2 + 40, ry * 2 + 40, 280); ctx.stroke(); ctx.shadowBlur = 0;
  const blink = Math.floor(lt * 3) % 2 === 0;
  tag(540, 220, '⚠ ПРИСТЕГНИТЕ РЕМНИ', null, blink ? C.red : '#5A1B24', 1, 'center', 40);
  const alt = Math.round(11000 - eio(seg(lt, 0, 4)) * 2600);
  tag(80, 1215, `▼ ${alt.toLocaleString('ru-RU')} м`, 'ВЫСОТА', C.red, seg(lt, 0.3, 0.8), 'left', 30);
  tag(1000, 1215, '−38 м/с', 'СНИЖЕНИЕ', C.amber, seg(lt, 0.6, 1.1), 'right', 30);
}, ['!САМОЛЁТ! ПАДАЕТ.', 'А ВЫ СИДИТЕ', 'В *РЯДУ 27*']);

// 2. Cabin schematic
S(4, 10, (lt) => {
  background();
  hud('СХЕМА САЛОНА · 192 МЕСТА', C.cyan);
  drawCabin({ appear: seg(lt, 0, 1.2), you: true, t: lt });
  const y27 = rowY(27);
  const k1 = seg(lt, 1.4, 1.8), k2 = seg(lt, 2.2, 2.6), k3 = seg(lt, 3.0, 3.4), k4 = seg(lt, 4.0, 4.4);
  ctx.strokeStyle = C.amber; ctx.lineWidth = 2; ctx.globalAlpha = k1;
  ctx.beginPath(); ctx.moveTo(489, y27); ctx.lineTo(260, y27 - 60); ctx.stroke(); ctx.globalAlpha = 1;
  tag(60, y27 - 120, 'ВЫ · 27C', 'У ПРОХОДА', C.amber, k1, 'left');
  ctx.strokeStyle = C.green; ctx.globalAlpha = k2; ctx.beginPath(); ctx.moveTo(736, 1228); ctx.lineTo(820, 1180); ctx.stroke(); ctx.globalAlpha = 1;
  tag(1030, 1110, 'ВЫХОД', '5 РЯДОВ НАЗАД', C.green, k2, 'right');
  ctx.strokeStyle = C.green; ctx.globalAlpha = k3; ctx.beginPath(); ctx.moveTo(736, 650); ctx.lineTo(850, 560); ctx.stroke(); ctx.globalAlpha = 1;
  tag(1030, 480, 'ВЫХОД', '14 РЯДОВ ВПЕРЁД', C.green, k3, 'right');
  tag(540, 1250, '⚠ 1 ОШИБКА = КОНЕЦ', null, C.red, k4, 'center', 34);
}, ['ВЫЖИВЕТЕ ВЫ', 'ИЛИ НЕТ —', '*РЕШИЛОСЬ*', 'ЕЩЁ *ДО ВЗЛЁТА*']);

// 3. Flight profile
S(10, 18, (lt) => {
  background();
  hud('ПРОФИЛЬ ПОЛЁТА', C.cyan);
  const x0 = 100, x1 = 980, yb = 1080, yt = 560;
  ctx.strokeStyle = 'rgba(70,203,255,0.25)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x0, yb); ctx.lineTo(x1, yb); ctx.stroke();
  const pts = [];
  for (let i = 0; i <= 200; i++) {
    const u = i / 200, x = lerp(x0, x1, u);
    let y;
    if (u < 0.22) y = lerp(yb, yt, eo(u / 0.22)); else if (u < 0.74) y = yt; else y = lerp(yt, yb, eio((u - 0.74) / 0.26));
    pts.push([x, y]);
  }
  const zk1 = seg(lt, 2.6, 3.0), zk2 = seg(lt, 4.6, 5.0);
  const z1 = [x0, x0 + 100], z2 = [x1 - 150, x1];
  [[z1, zk1, '+3 МИН', 'ПОСЛЕ ВЗЛЁТА'], [z2, zk2, '−8 МИН', 'ДО ПОСАДКИ']].forEach(([z, k, a, b]) => {
    if (k <= 0) return;
    ctx.globalAlpha = k;
    const g = ctx.createLinearGradient(0, yt - 80, 0, yb); g.addColorStop(0, 'rgba(255,52,72,0)'); g.addColorStop(1, 'rgba(255,52,72,0.45)');
    ctx.fillStyle = g; ctx.fillRect(z[0], yt - 80, z[1] - z[0], yb - yt + 80);
    ctx.strokeStyle = C.red; ctx.setLineDash([10, 8]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(z[0], yt - 80); ctx.lineTo(z[0], yb); ctx.moveTo(z[1], yt - 80); ctx.lineTo(z[1], yb); ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    const cx = (z[0] + z[1]) / 2;

  ctx.fillStyle = C.red; ctx.font = `800 52px ${MONO}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(s, 822, 142);
  ctx.fillStyle = C.dim; ctx.font = `500 18px ${MONO}`; ctx.fillText('ЭВАКУАЦИЯ', 822, 186);
  ctx.restore();
}

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const sc = scenes.find(s => t >= s.t0 && t < s.t1) || scenes[scenes.length - 1];
  const lt = t - sc.t0, dur = sc.t1 - sc.t0;
  ctx.save(); sc.draw(lt, dur); ctx.restore();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  // HUD timer pushed below the centered hud tag
  ctx.save(); ctx.translate(0, 0); evacTimer(t); ctx.restore();
  // subtitles
  const subs = sc.subs || [];
  if (subs.length) {
    const norm = subs.map((s, i) => typeof s === 'string' ? { s, a: 0.12 + i * dur / subs.length, b: 0.12 + (i + 1) * dur / subs.length } : s);
    const cur = norm.find(x => lt >= x.a && lt < x.b);
    if (cur) drawSub(cur.s, lt - cur.a, cur.big);
  }
  const fade = 1 - seg(lt, 0, 0.22);
  if (fade > 0 && sc.t0 > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}
window.render = render;
window.ready = Promise.all([
  document.fonts.load(`900 92px ${SANS}`), document.fonts.load(`800 30px ${MONO}`), document.fonts.load(`500 20px ${MONO}`)
]).then(() => true);
</script>
