<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1216">
  <meta name="color-scheme" content="dark">
  <title>Расписание уроков</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="school-name" id="school-name">Расписание</span>
        <span class="updated" id="updated" aria-live="polite"></span>
      </div>
      <button class="class-btn" id="class-btn" type="button" aria-haspopup="dialog" hidden>
        <span id="class-label"></span><span class="chev" aria-hidden="true">▾</span>
      </button>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Разделы" hidden>
      <button type="button" role="tab" data-view="today">Сегодня</button>
      <button type="button" role="tab" data-view="tomorrow">Завтра</button>
      <button type="button" role="tab" data-view="week">Неделя</button>
      <button type="button" role="tab" data-view="changes">Изменения<span class="dot" id="changes-dot" hidden></span></button>
      <button type="button" role="tab" data-view="search">Поиск</button>
    </nav>
  </header>

  <main class="container" id="main" aria-live="polite">
    <p class="muted center pad">Загрузка…</p>
  </main>

  <footer class="footer container">
    <details class="legend">
      <summary>Обозначения</summary>
      <ul>
        <li><span class="badge st-teacher">Замена учителя</span></li>
        <li><span class="badge st-subject">Другой предмет</span></li>
        <li><span class="badge st-room">Смена кабинета</span></li>
        <li><span class="badge st-cancel">Отмена урока</span></li>
        <li><span class="badge st-move">Перенос</span></li>
      </ul>
    </details>
    <a class="muted small" href="/admin">Вход для учителей</a>
  </footer>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
